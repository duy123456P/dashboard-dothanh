<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bản đồ thị trường 3D · Đô Thành</title>
<style>
:root{--bg:#050b16;--ink:#e8f3ff;--muted:#8ea7c7;--cyan:#46e3ff;--bad:#ff6b6b;--line:rgba(170,215,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 600px at 70% 20%,rgba(70,160,255,.18),transparent 60%),radial-gradient(800px 600px at 10% 110%,rgba(63,224,197,.12),transparent 60%),linear-gradient(180deg,#050b16,#0a1730);
  color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:-30vh;height:70vh;pointer-events:none;
  background-image:linear-gradient(rgba(70,227,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(70,227,255,.16) 1px,transparent 1px);background-size:56px 56px;
  transform:perspective(600px) rotateX(64deg);transform-origin:50% 0;-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,transparent);mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.card{position:relative;width:min(420px,100%);padding:30px 26px 24px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(160deg,rgba(140,190,255,.12),rgba(10,23,48,.6));box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 50px rgba(70,227,255,.1);backdrop-filter:blur(16px)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(var(--cyan),var(--cyan)) top left/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/2px 18px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) top right/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top right/2px 18px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom left/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom left/2px 18px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom right/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 18px no-repeat;filter:drop-shadow(0 0 4px rgba(70,227,255,.8))}
.eb{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
h1{margin:6px 0 4px;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
p{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.5}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:rgba(5,11,22,.6);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus{outline:2px solid var(--cyan);outline-offset:1px}
button{font:inherit;font-weight:600;cursor:pointer;color:#03121d;background:linear-gradient(90deg,#46e3ff,#3fe0c5);border:0;border-radius:10px;padding:0 16px;box-shadow:0 0 18px rgba(70,227,255,.35)}
button:disabled{opacity:.6;cursor:progress}
.msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}.msg.bad{color:var(--bad)}
.foot{margin-top:14px;font-size:11.5px;color:#5c7393}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="eb">Đô Thành Auto · Ben</div>
  <h1>Bản đồ thị trường 3D</h1>
  <p>Báo cáo nội bộ. Nhập mật khẩu để mở bản đồ.</p>
  <label for="pw">Mật khẩu</label>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" required autofocus><button id="go" type="submit">Mở</button></div>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
  <div class="foot">Nội dung được mã hóa AES-256; mật khẩu không gửi đi đâu, chỉ dùng để giải mã trên máy của Anh/Chị.</div>
</form>
<script id="payload" type="application/json">/*__PAYLOAD__*/</script>
<script>
(function(){
  var P = JSON.parse(document.getElementById("payload").textContent), f = document.getElementById("f"), m = document.getElementById("m"), go = document.getElementById("go");
  var b64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  if(!window.crypto || !crypto.subtle){ m.className = "msg bad"; m.textContent = "Trình duyệt chưa hỗ trợ giải mã. Hãy mở bằng Chrome bản mới qua đường dẫn https."; go.disabled = true; return; }
  f.addEventListener("submit", function(e){
    e.preventDefault(); var pw = document.getElementById("pw").value; if(!pw) return;
    go.disabled = true; m.className = "msg"; m.textContent = "Đang giải mã…";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim()), "PBKDF2", false, ["deriveKey"])
      .then(function(k){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["decrypt"]); })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c)); })
      .then(function(buf){ var html = new TextDecoder().decode(buf); m.textContent = "Đang mở bản đồ…"; setTimeout(function(){ document.open(); document.write(html); document.close(); }, 30); })
      .catch(function(){ go.disabled = false; m.className = "msg bad"; m.textContent = "Sai mật khẩu. Mật khẩu được đổi định kỳ, hãy hỏi người quản lý mật khẩu mới."; document.getElementById("pw").select(); });
  });
})();
</script>
</body>
</html>
